[package]
name = "iis2dlpc-rs"
version = "2.0.0"
edition = "2024"
rust-version = "1.87.0"
readme = "README.md"
license = "BSD-3-Clause"
categories = ["embedded", "no-std"]
keywords = ["st", "mems", "accelerometer", "low-power", "high-performance"]
repository = "https://github.com/STMicroelectronics/iis2dlpc-rs"
description = """
    Driver for the IIS2DLPC ultra-low-power three-axis accelerometer with selectable 
    full scale, multiple power modes, FIFO, and advanced motion detection.
"""

[lib]
doctest = false

[dependencies]
bisync = "0.3.0"
bitfield-struct = "0.11.0"
embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"
derive_more = { version = "2.0.1", default-features = false, features = [ "try_from" ] }
st-mems-bus = "2.0.0"
st-mem-bank-macro = "2.0.0"

[patch.crates-io]
bisync = { path = "vendor/bisync" }

# Features
# --------
# - By default the async API is enabled via the `async` feature.
#   Enable `blocking` to use the blocking variant instead.
#
# - Bit order defaults to Least Significant Bit first.
#   Enable `bit_order_msb` to use Most Significant Bit first.
[features]
default = ["async"]
# Expose the asynchronous driver module.
async = []
# Expose the blocking driver module.
blocking = []
# Use Most Significant Bit first instead of the default LSB-first ordering.
bit_order_msb = []

[package.metadata.docs.rs]
all-features = true
